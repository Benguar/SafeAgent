version: "1.0"
metadata:
  name: "SafeAgent Policy "
  description: "Rules for prompt injection and sanitization"

block:
  - name: "prompt_injection"
    id: 4041
    pattern: "(ignore|forget|disregard) (all )?(the )?(previous |system )?instructions?"
    action: "block"
    weight: 1
  - name: "prompt_injection"
    id: 4042
    pattern: "(override|ignore|forget) (all )?(the )?system prompt(s)?"
    action: "block"
    weight: 0.9
  - name: "prompt_injection"
    id: 4043
    pattern: "(show|give|tell) (me )?(your )?admin passwords?"
    action: "block"
    weight: 0.95
  - name: "prompt_injection"
    id: 4051
    pattern: "(show|give|tell) (me )?(your )?(databases?|passwords?)"
    action: "block"
    weight: 1
  
sanitize:
  - name: "credit card"
    id: 5011
    pattern: "\\b(?:\\d{4}[ _-]?){3}\\d{4}\\b|\\b3[47]\\d{2}[ _-]?\\d{6}[ _-]?\\d{5}\\b"
    action: "[REDACTED CREDIT CARD]"
  - name: "password"
    id: 5022
    pattern: "\\b(?:password|passwords|passwd|pwd|pass)\\s*(?:is|are|[:=-])\\s*([^\\s]+)"
    action: "[REDACTED SECRET]"
  - name: "API key"
    id: 5031
    pattern: "(?:api[_-]?key|secret|token|auth)\\s*[:=]\\s*([a-z0-9\\-_]{20,})"
    action: "[REDACTED API KEY]"
  - name: "API key"
    id: 5032
    pattern: "akia[0-9a-z]{16}"
    action: "[REDACTED AWS KEY]"
  - name: "API key"
    id: 5033
    pattern: "(ghp|gho|ghu|ghs|ghr)_[a-z0-9]{36}"
    action: "[REDACTED GITHUB TOKEN]"
  - name: "API key"
    id: 5034
    pattern: "sk_(live|test)_[a-z0-9]{24}"
    action: "[REDACTED STRIPE KEY]"
  - name: "API key"
    id: 5035
    pattern: "aiza[0-9a-z\\-_]{35}"
    action: "[REDACTED GOOGLE KEY]"
  - name: "API key"
    id: 5036
    pattern: "sq0(idp|csp)-[0-9a-z\\-_]{22,43}"
    action: "[REDACTED SQUARE KEY]"
  - name: "email"
    id: 5041
    pattern: "[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-zA-Z]{2,}"
    action: "[REDACTED EMAIL]"
  - name: "ip address"
    id: 5042
    pattern: "\\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\b"
    action: "[REDACTED IP  ADDRESS]"
  - name: "Us/Canada number"
    id: 5043
    pattern: "\b(?:\\+?1[-.\\s]?)?\\(?[0-9]{3}\\)?[-.\\s]?[0-9]{3}[-.\\s]?[0-9]{4}\b"
    action: "[REDACTED PHONE NUMBER]"
  - name: "Nigeria number"
    id: 5044
    pattern: "\b(?:\\+?234[-.\\s]?)?\\(?0?\\)?[-.\\s]?[789][0-9]{2}[-.\\s]?[0-9]{3}[-.\\s]?[0-9]{4}\b"
    action: "[REDACTED PHONE NUMBER]"
  - name: "UK number"
    id: 5045
    pattern: "\b(?:\\+?44[-.\\s]?)?\\(?0?\\)?[-.\\s]?[1-9][0-9]{1,4}[-.\\s]?[0-9]{3,4}[-.\\s]?[0-9]{3,4}\b"
    action: "[REDACTED PHONE NUMBER]"
  